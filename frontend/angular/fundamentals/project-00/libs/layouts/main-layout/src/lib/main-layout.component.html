<mat-toolbar class="header">
  <button
    matIconButton
    type="button"
    aria-label="Toggle navigation menu"
    data-testid="menu-toggle"
    (click)="menuToggle.emit()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span class="title">{{ appTitle() }}</span>
  <span class="spacer"></span>
  @if (username()) {
    <span class="user" data-testid="current-user">
      @if (pictureUrl() && failedPicture() !== pictureUrl()) {
        <img
          class="avatar"
          data-testid="user-avatar"
          [src]="pictureUrl()"
          alt=""
          width="32"
          height="32"
          referrerpolicy="no-referrer"
          (error)="failedPicture.set(pictureUrl())"
        />
      } @else {
        <span class="avatar avatar-initials" data-testid="user-initials" aria-hidden="true">{{ initials() }}</span>
      }
      <span class="user-name">{{ username() }}</span>
    </span>
  }
  @if (roles().length > 0) {
    <label class="role-switcher">
      <span class="role-label">Acting as</span>
      <select
        data-testid="role-switcher"
        aria-label="Switch role"
        (change)="roleChange.emit($any($event.target).value)"
      >
        @for (role of roles(); track role) {
          <option [value]="role" [selected]="role === activeRole()">{{ role }}</option>
        }
      </select>
    </label>
  }
  <button mat-button type="button" data-testid="auth-action" (click)="authAction.emit()">
    <mat-icon>{{ username() ? 'logout' : 'login' }}</mat-icon>
    {{ username() ? 'Log out' : 'Log in' }}
  </button>
  <button
    matIconButton
    type="button"
    data-testid="theme-toggle"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    [matTooltip]="theme() === 'dark' ? 'Light theme' : 'Dark theme'"
    (click)="themeToggle.emit()"
  >
    <mat-icon>{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpenedChange.emit($event)"
  >
    <mat-nav-list aria-label="Main navigation">
      @for (item of menuItems(); track item.id) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          [activated]="rla.isActive"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
