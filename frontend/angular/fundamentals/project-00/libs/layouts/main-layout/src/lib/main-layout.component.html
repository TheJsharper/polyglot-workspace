<mat-toolbar class="header">
  <button
    matIconButton
    type="button"
    aria-label="Toggle navigation menu"
    data-testid="menu-toggle"
    (click)="menuToggle.emit()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span class="title">{{ appTitle() }}</span>
  <span class="spacer"></span>
  @if (username()) {
    <span>{{ username() }}</span>
  }
  <button mat-button type="button" (click)="authAction.emit()">
    {{ username() ? 'Log out' : 'Log in' }}
  </button>
  <button
    matIconButton
    type="button"
    data-testid="theme-toggle"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    [matTooltip]="theme() === 'dark' ? 'Light theme' : 'Dark theme'"
    (click)="themeToggle.emit()"
  >
    <mat-icon>{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpenedChange.emit($event)"
  >
    <mat-nav-list aria-label="Main navigation">
      @for (item of menuItems(); track item.id) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          [activated]="rla.isActive"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
