<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>University</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script type="esms-options">{"shimMode":true}</script>
    <script defer src="es-module-shims.js"></script>
    <script>
      try {
        const theme = localStorage.getItem('app.theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.classList.add(`${theme}-theme`);
        }
      } catch (error) {
        console.warn('Could not restore the theme before startup', error);
      }
    </script>
    <style>
      html {
        color-scheme: light dark;
      }

      html.dark-theme {
        color-scheme: dark;
      }

      html.light-theme {
        color-scheme: light;
      }

      .startup-screen {
        --startup-page: var(--mat-sys-surface);
        --startup-card: var(--mat-sys-surface-container-low);
        --startup-border: var(--mat-sys-outline-variant);
        --startup-block: var(--mat-sys-surface-container-high);
        --startup-shimmer: var(--mat-sys-surface-container-highest);
        --startup-text: var(--mat-sys-on-surface);
        --startup-muted: var(--mat-sys-on-surface-variant);
        --startup-spinner-track: var(--mat-sys-outline-variant);
        --startup-accent: var(--mat-sys-primary);
        --startup-accent-text: var(--mat-sys-on-primary);
        --startup-shadow: var(--mat-sys-level3);
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: var(--startup-text);
        font-family: Roboto, Arial, sans-serif;
        text-align: center;
      }

      .startup-skeleton {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 1rem clamp(1rem, 4vw, 3rem) 2rem;
        background: var(--startup-page);
        text-align: left;
      }

      .startup-skeleton-header {
        display: flex;
        align-items: center;
        gap: clamp(1rem, 4vw, 3rem);
        max-width: 76rem;
        height: 3.5rem;
        margin: 0 auto;
        padding: 0 1rem;
        border: 1px solid var(--startup-border);
        border-radius: 0.75rem;
        background: var(--startup-card);
      }

      .startup-skeleton-brand {
        width: 2rem;
        height: 2rem;
        flex: 0 0 auto;
        border-radius: 0.5rem !important;
      }

      .startup-skeleton-search {
        width: min(20rem, 40%);
        height: 2rem;
        border-radius: 1rem !important;
      }

      .startup-skeleton-header-actions {
        display: flex;
        gap: 1.25rem;
        margin-left: auto;
      }

      .startup-skeleton-header-actions .startup-skeleton-block {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
      }

      .startup-skeleton-content {
        display: grid;
        grid-template-columns: minmax(10rem, 14rem) minmax(20rem, 38rem) minmax(10rem, 16rem);
        align-items: start;
        gap: 1.25rem;
        max-width: 76rem;
        margin: 1.5rem auto 0;
      }

      .startup-skeleton-card {
        display: grid;
        gap: 1rem;
        padding: 1.25rem;
        border: 1px solid var(--startup-border);
        border-radius: 0.75rem;
        background: var(--startup-card);
      }

      .startup-skeleton-profile {
        justify-items: center;
        padding-top: 1.5rem;
      }

      .startup-skeleton-avatar {
        width: 4rem;
        height: 4rem;
        border-radius: 50% !important;
      }

      .startup-skeleton-block {
        position: relative;
        overflow: hidden;
        min-height: 0.8rem;
        border-radius: 0.35rem;
        background: var(--startup-block);
      }

      .startup-skeleton-block::after {
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, var(--startup-shimmer), transparent);
        animation: startup-shimmer 1.5s ease-in-out infinite;
        content: "";
      }

      .startup-skeleton-line {
        width: 100%;
      }

      .startup-skeleton-line-short {
        width: 58%;
      }

      .startup-skeleton-heading {
        width: 65%;
        height: 1.2rem;
      }

      .startup-skeleton-caption {
        width: 40%;
      }

      .startup-skeleton-post {
        gap: 1.1rem;
      }

      .startup-skeleton-post-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .startup-skeleton-post-header .startup-skeleton-avatar {
        width: 2.75rem;
        height: 2.75rem;
      }

      .startup-skeleton-post-identity {
        display: grid;
        flex: 1;
        gap: 0.45rem;
      }

      .startup-skeleton-post-content {
        display: grid;
        gap: 0.6rem;
      }

      .startup-skeleton-post-image {
        height: 8rem;
        border-radius: 0.5rem;
      }

      .startup-skeleton-side-title {
        width: 75%;
        height: 1rem;
      }

      .startup-skeleton-side-row {
        display: grid;
        gap: 0.5rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--startup-border);
      }

      .startup-card {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 0.75rem;
        max-width: 24rem;
        padding: 1.5rem 2rem;
        border: 1px solid var(--startup-border);
        border-radius: 0.9rem;
        background: var(--startup-card);
        box-shadow: var(--startup-shadow);
        backdrop-filter: blur(8px);
      }

      .startup-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 0.25rem solid var(--startup-spinner-track);
        border-top-color: var(--startup-accent);
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }

      .startup-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 500;
      }

      .startup-elapsed,
      .startup-help {
        margin: 0;
        color: var(--startup-muted);
      }

      .startup-retry {
        margin-top: 0.5rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 0.35rem;
        background: var(--startup-accent);
        color: var(--startup-accent-text);
        cursor: pointer;
        font: inherit;
      }

      .startup-retry:focus-visible {
        outline: 3px solid var(--startup-accent);
        outline-offset: 3px;
      }

      [hidden] {
        display: none !important;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes startup-shimmer {
        to {
          transform: translateX(100%);
        }
      }

      @media (max-width: 56rem) {
        .startup-skeleton-content {
          grid-template-columns: minmax(10rem, 14rem) minmax(20rem, 38rem);
          justify-content: center;
        }

        .startup-skeleton-right {
          display: none;
        }
      }

      @media (max-width: 40rem) {
        .startup-skeleton {
          padding: 0.75rem;
        }

        .startup-skeleton-content {
          grid-template-columns: minmax(0, 38rem);
          margin-top: 0.75rem;
        }

        .startup-skeleton-left,
        .startup-skeleton-header-actions {
          display: none;
        }

        .startup-skeleton-header {
          height: 3rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation-duration: 2s;
        }

        .startup-skeleton-block::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-screen" class="startup-screen">
      <div class="startup-skeleton" aria-hidden="true">
        <header class="startup-skeleton-header">
          <div class="startup-skeleton-block startup-skeleton-brand"></div>
          <div class="startup-skeleton-block startup-skeleton-search"></div>
          <div class="startup-skeleton-header-actions">
            <div class="startup-skeleton-block"></div>
            <div class="startup-skeleton-block"></div>
            <div class="startup-skeleton-block"></div>
          </div>
        </header>
        <div class="startup-skeleton-content">
          <aside class="startup-skeleton-card startup-skeleton-profile startup-skeleton-left">
            <div class="startup-skeleton-block startup-skeleton-avatar"></div>
            <div class="startup-skeleton-block startup-skeleton-heading"></div>
            <div class="startup-skeleton-block startup-skeleton-caption"></div>
            <div class="startup-skeleton-block startup-skeleton-line"></div>
            <div class="startup-skeleton-block startup-skeleton-line-short"></div>
          </aside>
          <main class="startup-skeleton-feed">
            <section class="startup-skeleton-card startup-skeleton-post">
              <div class="startup-skeleton-post-header">
                <div class="startup-skeleton-block startup-skeleton-avatar"></div>
                <div class="startup-skeleton-post-identity">
                  <div class="startup-skeleton-block startup-skeleton-line-short"></div>
                  <div class="startup-skeleton-block startup-skeleton-caption"></div>
                </div>
              </div>
              <div class="startup-skeleton-post-content">
                <div class="startup-skeleton-block startup-skeleton-line"></div>
                <div class="startup-skeleton-block startup-skeleton-line"></div>
                <div class="startup-skeleton-block startup-skeleton-line-short"></div>
              </div>
              <div class="startup-skeleton-block startup-skeleton-post-image"></div>
            </section>
            <section class="startup-skeleton-card startup-skeleton-post">
              <div class="startup-skeleton-post-header">
                <div class="startup-skeleton-block startup-skeleton-avatar"></div>
                <div class="startup-skeleton-post-identity">
                  <div class="startup-skeleton-block startup-skeleton-line-short"></div>
                  <div class="startup-skeleton-block startup-skeleton-caption"></div>
                </div>
              </div>
              <div class="startup-skeleton-post-content">
                <div class="startup-skeleton-block startup-skeleton-line"></div>
                <div class="startup-skeleton-block startup-skeleton-line-short"></div>
              </div>
            </section>
          </main>
          <aside class="startup-skeleton-card startup-skeleton-right">
            <div class="startup-skeleton-block startup-skeleton-side-title"></div>
            <div class="startup-skeleton-side-row">
              <div class="startup-skeleton-block startup-skeleton-line"></div>
              <div class="startup-skeleton-block startup-skeleton-caption"></div>
            </div>
            <div class="startup-skeleton-side-row">
              <div class="startup-skeleton-block startup-skeleton-line"></div>
              <div class="startup-skeleton-block startup-skeleton-caption"></div>
            </div>
            <div class="startup-skeleton-side-row">
              <div class="startup-skeleton-block startup-skeleton-line"></div>
              <div class="startup-skeleton-block startup-skeleton-caption"></div>
            </div>
          </aside>
        </div>
      </div>
      <div class="startup-card">
        <div id="startup-loading" role="status" aria-live="polite">
          <div class="startup-spinner" aria-hidden="true"></div>
          <p class="startup-title">Loading University...</p>
          <p id="startup-elapsed" class="startup-elapsed" aria-hidden="true">0 seconds elapsed</p>
        </div>
        <div id="startup-error" role="alert" hidden>
          <h1 class="startup-title">University couldn't start</h1>
          <p class="startup-help">Check your internet connection, then try again.</p>
          <button id="startup-retry" class="startup-retry" type="button">Try again</button>
        </div>
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
