<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>University</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script type="esms-options">{"shimMode":true}</script>
    <script defer src="es-module-shims.js"></script>
    <style>
      .startup-screen {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #1f2937;
        font-family: Roboto, Arial, sans-serif;
        text-align: center;
      }

      .startup-card {
        display: grid;
        justify-items: center;
        gap: 0.75rem;
        max-width: 24rem;
      }

      .startup-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 0.25rem solid #cbd5e1;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }

      .startup-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 500;
      }

      .startup-elapsed,
      .startup-help {
        margin: 0;
        color: #475569;
      }

      .startup-retry {
        margin-top: 0.5rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 0.35rem;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }

      .startup-retry:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 3px;
      }

      [hidden] {
        display: none !important;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-screen" class="startup-screen">
      <div class="startup-card">
        <div id="startup-loading" role="status" aria-live="polite">
          <div class="startup-spinner" aria-hidden="true"></div>
          <p class="startup-title">Loading University...</p>
          <p id="startup-elapsed" class="startup-elapsed" aria-hidden="true">0 seconds elapsed</p>
        </div>
        <div id="startup-error" role="alert" hidden>
          <h1 class="startup-title">University couldn't start</h1>
          <p class="startup-help">Check your internet connection, then try again.</p>
          <button id="startup-retry" class="startup-retry" type="button">Try again</button>
        </div>
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
