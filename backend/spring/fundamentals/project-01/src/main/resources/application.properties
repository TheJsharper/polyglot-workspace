spring.application.name=project-01
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8081}
# Internal service: reachable from this machine only unless a deployment overrides it deliberately.
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:h2:mem:project01;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Service-to-service authentication: callers present an HS256 token signed with this shared secret (min 32 chars).
app.service-auth.secret=${SERVICE_AUTH_SECRET}
app.service-auth.issuer=${SERVICE_AUTH_ISSUER:project-00}
app.service-auth.audience=demo-keys-service

# Async job execution
app.jobs.max-retained=200
