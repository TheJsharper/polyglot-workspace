spring.application.name=project-00
spring.config.import=optional:file:.env[.properties]
# Profiles: dev (default; H2 console, Swagger UI and local sample data) or prod (set SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev
spring.datasource.url=${DB_URL:jdbc:h2:mem:project00;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**

# Security: supplied by environment variables or the untracked .env file (see .env.example)
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl=${JWT_TTL:1h}
app.security.jwt.issuer=${JWT_ISSUER:project-00}
