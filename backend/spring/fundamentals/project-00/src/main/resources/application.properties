spring.application.name=project-00
spring.datasource.url=jdbc:h2:mem:project00;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.paths-to-match=/api/**

# Security (development defaults only - override in any real environment)
app.security.admin.username=admin
app.security.admin.password=admin-change-me
app.security.jwt.secret=dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz
app.security.jwt.ttl=1h
app.security.jwt.issuer=project-00
