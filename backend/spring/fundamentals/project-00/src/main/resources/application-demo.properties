# Public demo deployment: seeded personas, no H2 console or Swagger, database and secrets from the environment.
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
server.forward-headers-strategy=framework
app.demo.enabled=true
# PEM-encoded EC (P-256) public key used to verify offline-signed demo tokens; the private key never goes on the server.
app.demo.public-key=${DEMO_PUBLIC_KEY:}
# Comma-separated token ids (jti) to block without rotating keys.
app.demo.revoked-jtis=${DEMO_REVOKED_JTIS:}
