spring.config.import=optional:file:.env.dev[.properties]
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
server.address=127.0.0.1
app.demo.enabled=true
app.manager.email=pedro.salomon@gmail.com

# Demo-keys microservice (project-01): base URL and shared service secret (min 32 chars, same as its SERVICE_AUTH_SECRET)
app.demo-keys.base-url=${DEMO_KEYS_SERVICE_URL:http://127.0.0.1:8081}
app.demo-keys.secret=${DEMO_KEYS_SERVICE_SECRET:}
