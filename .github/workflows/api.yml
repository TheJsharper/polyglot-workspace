name: API

on:
  pull_request:
    paths:
      - 'backend/spring/**'
      - '!backend/spring/**/*.md'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'backend/spring/**'
      - '!backend/spring/**/*.md'
      - '.github/workflows/api.yml'

# A deploy in flight on main is never cancelled; only superseded pull request runs are.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [project-00, project-01]
    defaults:
      run:
        working-directory: backend/spring/fundamentals/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -q clean test

  # Releases only run for pushes to main and only after every backend test passed.
  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
