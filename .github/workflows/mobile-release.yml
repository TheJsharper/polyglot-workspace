name: Mobile release

# Manual store release through EAS. Needs the EXPO_TOKEN secret plus Apple/Google credentials stored in EAS.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Submit the build to TestFlight / Google Play
        type: boolean
        default: false

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FRONTEND_DIR: frontend/angular/fundamentals/project-00
  APP_DIR: frontend/angular/fundamentals/project-00/apps/mobiles/app

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EAS credentials
        id: gate
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set; skipping the store release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: |
            ${{ env.FRONTEND_DIR }}/package-lock.json
            ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ env.APP_DIR }}
      - name: Build with EAS
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ env.APP_DIR }}
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          ARGS="--platform $PLATFORM --profile $PROFILE --non-interactive --wait"
          if [ "$SUBMIT" = "true" ]; then ARGS="$ARGS --auto-submit"; fi
          npx eas-cli@latest build $ARGS
