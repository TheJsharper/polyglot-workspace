name: iOS build

# Compiles the iOS app on a macOS runner. The simulator build needs no Apple account or signing.
on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'frontend/angular/fundamentals/project-00/apps/mobiles/app/eas.json'
      - 'frontend/angular/fundamentals/project-00/apps/mobiles/app/app.json'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FRONTEND_DIR: frontend/angular/fundamentals/project-00
  APP_DIR: frontend/angular/fundamentals/project-00/apps/mobiles/app

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: |
            ${{ env.FRONTEND_DIR }}/package-lock.json
            ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm ci
        working-directory: ${{ env.APP_DIR }}
      - name: Generate the native iOS project
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
      - name: Build for the iOS Simulator
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package the app
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          mkdir -p ../ios-out
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/*.app ../ios-out/app-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ env.APP_DIR }}/ios-out/app-simulator.zip
          retention-days: 14
